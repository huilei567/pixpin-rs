[package]
name = "pixpin-rs"
version = "0.5.3"
edition = "2021"
description = "A PixPin-like screenshot, annotation & OCR tool built with Rust + GPUI"
license = "Apache-2.0"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25.1", default-features = false, features = ["png"] }
smallvec = "1"
arboard = "3"
anyhow = "1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
pixocr = { path = "crates/pixocr" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
